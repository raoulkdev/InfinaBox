[package]
name = "infinabox-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "infinabox_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
git2 = "0.21.0"
notify = "6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }

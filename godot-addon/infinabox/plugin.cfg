; The InfinaBox addon. Installed and kept up to date by the InfinaBox app
; (addons/infinabox/ is overwritten on update, so don't edit it by hand).
; Its runtime part is the InfinaBox autoload (infinabox_runtime.gd), which
; the app registers in project.godot's [autoload] section: editor plugins
; don't run inside the game itself.

[plugin]

name="InfinaBox"
description="Debug channel between a running game and the InfinaBox app. Inert in release exports."
author="InfinaBox"
version="1"
script="infinabox_plugin.gd"
